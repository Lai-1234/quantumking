[project]
name = "quantumking"
version = "0.1.0"
description = "Python research pipeline for QuantumKing MQL5 EA (XAUUSD)"
requires-python = ">=3.10"
dependencies = [
    "MetaTrader5>=5.0.45",
    "pandas>=2.1",
    "numpy>=1.26",
    "pyarrow>=15.0",
    "optuna>=3.5",
    "matplotlib>=3.8",
    "scipy>=1.11",
]
# Note: the custom bar-by-bar engine in backtest.py does not require
# vectorbt. Install vectorbt separately on Python <=3.12 if you want
# vectorized backtests for simple strategies.

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "jupyter>=1.0",
    "ipykernel>=6.29",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["quantumking*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
